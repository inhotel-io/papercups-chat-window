name: CI/CD

# Build every change; ship main to chat.inhotel.io.
#
# chat.inhotel.io serves /widget.js, the launcher script customer sites embed,
# and the iframe page it opens. It runs as Deployment inhotel-chat-window in
# namespace inhtoel-agent-app (the typo is the real name) on the inhotel-agent
# GKE cluster, beside inhotel-mobile-chat.
#
# build   Every pull request and every push to main. `next build` type-checks
#         as well. It holds no credential, so a pull request from a fork has
#         nothing to steal.
# deploy  Pushes to main and manual runs on main, once build passes. It pushes
#         the image tagged with the commit SHA and moves the Deployment onto it.
#         k8s/ was applied once by hand; only the image changes here.
#
# The deploy signs in to GCP through Workload Identity Federation, so there is
# no key in this repository. The provider and service account are repository
# variables (GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT), not secrets: neither is
# confidential. Until GCP_WIF_PROVIDER is set the deploy job is skipped, not
# failed.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a pull request supersedes the build in flight. A run on
  # main is never cancelled: a rollout stopped halfway is a state no run chose.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT_ID: inhotel-prod
  GKE_CLUSTER: inhotel-agent
  GKE_LOCATION: europe-west6
  GKE_NAMESPACE: inhtoel-agent-app
  DEPLOYMENT: inhotel-chat-window
  CONTAINER: chat-window
  IMAGE: gcr.io/inhotel-prod/inhotel-chat-window

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # What the Dockerfile builds and serves with (package.json "engines").
          node-version: 16.20.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  deploy:
    needs: build
    # A job whose `if:` is false never gets a runner. `vars` is readable here
    # and `secrets` is not, which is one more reason the identity is variables.
    if: github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # the OIDC token GCP federates; auth fails opaquely without it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Build and push the image
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          printf '%s' "$ACCESS_TOKEN" | docker login -u oauth2accesstoken --password-stdin https://gcr.io
          docker build -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"

      # Writes a kubeconfig holding a short-lived token, so kubectl needs no
      # gke-gcloud-auth-plugin.
      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Roll the Deployment onto the new image
        run: |
          set -euo pipefail
          kubectl -n "$GKE_NAMESPACE" set image "deployment/$DEPLOYMENT" "$CONTAINER=$IMAGE:$GITHUB_SHA"
          # The old pods keep serving until the new ones are ready. If the new
          # ones never get there, put the previous image back rather than leave
          # the rollout stuck halfway.
          if ! kubectl -n "$GKE_NAMESPACE" rollout status "deployment/$DEPLOYMENT" --timeout=300s; then
            kubectl -n "$GKE_NAMESPACE" rollout undo "deployment/$DEPLOYMENT"
            echo "::error title=Rollout failed::$IMAGE:$GITHUB_SHA never became ready; the previous image was restored."
            exit 1
          fi

      - name: Check chat.inhotel.io serves the widget
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            --max-time 30 --output /dev/null https://chat.inhotel.io/widget.js
