apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inhotel-chat-window
  namespace: inhtoel-agent-app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: chat.inhotel.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inhotel-chat-window
                port:
                  number: 80
  tls:
    - hosts: [chat.inhotel.io]
      secretName: chat-inhotel-tls
